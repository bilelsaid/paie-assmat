plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bilel.paieassmat'
    compileSdk 34

    defaultConfig {
        applicationId "com.bilel.paieassmat"
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName "1.5.0"
    }

    // Signature release par notre propre clé (D5). Les valeurs viennent de l'environnement : aucune clé ni mot de passe dans le dépôt.
    signingConfigs {
        release {
            def ks = System.getenv('ANDROID_KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
